name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Build
        env:
          FASTBREAK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PYTHONOPTIMIZE: "1"
        run: pyinstaller --noconfirm --clean FastBreak.spec

      - name: Size
        shell: pwsh
        run: "'{0:N1} MB' -f ((Get-Item dist/FastBreak.exe).Length / 1MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: FastBreak
          path: dist/FastBreak.exe

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FastBreak.exe
          generate_release_notes: true
